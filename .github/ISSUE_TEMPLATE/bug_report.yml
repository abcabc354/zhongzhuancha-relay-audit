name: Bug report
description: Report a reproducible audit or CLI bug
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请勿粘贴 API key、cookie、完整请求头或 `.local.env` 内容。日志请先脱敏。
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: 实际结果与预期结果
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: 命令、审计目录或报告片段（脱敏后）
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.2
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python / OS
      placeholder: Python 3.11.9, macOS 15
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: 已脱敏的 traceback 或日志
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: 我已移除 API key、cookie、完整请求头
          required: true
        - label: 这是工具/报告问题，不是单一中转的可用性问题
          required: false
